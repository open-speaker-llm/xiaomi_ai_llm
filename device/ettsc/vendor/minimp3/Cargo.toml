[package]
name = "minimp3"
version = "0.5.2"
edition = "2018"
license = "MIT"
authors = ["germän gômez <germangb42@gmail.com>", "Erin Moon <erin@hashbang.sh>"]
description = "minimp3 0.5.2 with a locally maintained standard-library buffer patch"
repository = "https://github.com/germangb/minimp3-rs.git"
publish = false

[dependencies]
minimp3-sys = "0.3"
thiserror = "1.0.23"
tokio = { version = "1.0", features = ["io-util"], optional = true }

[features]
default = []
async_tokio = ["tokio"]
